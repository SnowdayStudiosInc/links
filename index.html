<!DOCTYPE html>

<!--
  To change the theme, change the class on the html tag below to one of:
  - theme-auto: Automatically switches based on user's system preferences
  - theme-light: Forces light theme
  - theme-dark: Forces dark theme
-->

<html class="theme-auto" lang="en"> <!-- Update `class="theme-auto"` with your preference -->

  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Page Title - Change this to your name/brand (50-60 characters recommended) -->
    <title>Links - Snowday Studios</title>
    <link rel="icon" type="image/png" href="images/avatar.png"> <!-- Update this with your own favicon -->

    <!-- Meta Description - Write a description (150-160 characters recommended) -->
    <meta name="description" content="Snowday Studios is a Winnipeg-based game development studio. Here are links to our social media and other platforms.">

    <!-- Canonical URL - Helps prevent duplicate content issues -->
    <link rel="canonical" href="https://snowdaystudios.com/">

    <!-- Author Information -->
    <meta name="author" content="Your Name">

    <!-- Browser UI Color - Matches the default light/dark theme backgrounds -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">

    <!-- Social Sharing (Open Graph & Twitter) - Uncomment and fill in to control how your page
         looks when shared on social platforms and in chat apps.
         og:url and og:image must be full absolute URLs. -->

    <meta property="og:type" content="website">
    <meta property="og:title" content="Snowday Studios">
    <meta property="og:description" content="Snowday Studios is a Winnipeg-based game development studio. Here are links to our social media and other platforms.">
    <meta property="og:url" content="https://snowdaystudios.com/">
    <meta property="og:image" content="https://snowdaystudios.com/images/avatar@2x.png">
    <meta name="twitter:card" content="Snowday Studios is a Winnipeg-based game development studio. Here are links to our social media and other platforms.">


    <!-- Font Preloads - Lets the browser fetch fonts in parallel with the stylesheets -->
    <link rel="preload" href="fonts/open-sans-v34-vietnamese_latin-ext_latin_hebrew_greek-ext_greek_cyrillic-ext_cyrillic-regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="fonts/open-sans-v34-vietnamese_latin-ext_latin_hebrew_greek-ext_greek_cyrillic-ext_cyrillic-700.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="fonts/open-sans-v34-vietnamese_latin-ext_latin_hebrew_greek-ext_greek_cyrillic-ext_cyrillic-800.woff2" as="font" type="font/woff2" crossorigin>

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/brands.css">

    <!-- LittleLink Extended Stylesheet (Optional) -->
    <!-- <link rel="stylesheet" href="css/brands-extended.css"> -->
    <!-- Learn more at https://github.com/sethcottle/littlelink-extended.
         Remove comments if you've added LittleLink Extended dependencies -->

  </head>

<body>

    <div class="container">
        <div class="column">
          <main>

            <!--
              By default, the Avatar is rounded. Use the following:
              - avatar--rounded: Automatically rounds the image
              - avatar--soft: Slightly rounds the image
              - avatar--none: Removes any rounding

              Be sure to replace the src with your own image path and update the alt text
            -->
            <img class="avatar avatar--rounded" src="images/avatar.png" srcset="images/avatar@2x.png 2x" alt="LittleLink" width="128" height="128" fetchpriority="high">

            <!-- Replace with your name or brand -->
            <h1>Snowday Studios</h1>

            <!-- Add a short description about yourself or your brand -->
            <p>Winnipeg Game Developers</p>

            <!-- All your buttons go here -->
            <nav class="button-stack" aria-label="Links">

              <!-- Discord -->
              <!--<a class="button button-discord" href="#" target="_blank" rel="noopener"><img class="icon" aria-hidden="true" src="images/icons/discord.svg" alt="Discord Logo">Discord</a>-->

              <!-- Steam Alt -->
              <!--<a class="button button-steam-alt" href="#" target="_blank" rel="noopener"><img class="icon" aria-hidden="true" src="images/icons/steam.svg" alt="Steam Logo">Steam</a>-->

              <!-- TikTok -->
              <a class="button button-tiktok" href="https://www.tiktok.com/@snowdaystudios" target="_blank" rel="noopener"><img class="icon" aria-hidden="true" src="images/icons/tiktok.svg" alt="TikTok Logo">TikTok</a>

              <!-- Instagram -->
              <a class="button button-instagram" href="https://www.instagram.com/snowdaystudios.inc/" target="_blank" rel="noopener"><img class="icon" aria-hidden="true" src="images/icons/instagram.svg" alt="Instagram Logo">Instagram</a>
              
              <!-- YouTube Alt -->
              <a class="button button-yt-alt" href="https://www.youtube.com/@SnowdayStudiosInc" target="_blank" rel="noopener"><img class="icon" aria-hidden="true" src="images/icons/youtube-alt.svg" alt="YouTube Logo">YouTube</a>

              <!-- Twitter -->
              <a class="button button-twitter" href="https://twitter.com/Snowday_Studios" target="_blank" rel="noopener" role="button"><img class="icon" aria-hidden="true" src="images/icons/twitter.svg" alt="Twitter Logo">Twitter</a>

              <!-- LinkedIn -->
              <a class="button button-linked" href="https://www.linkedin.com/company/snowday-studios-inc" target="_blank" rel="noopener"><img class="icon" aria-hidden="true" src="images/icons/linkedin.svg" alt="LinkedIn Logo">LinkedIn</a>

      </nav>
      </main>

      <!-- Feel free to add your own footer information, including updating `privacy.html` to reflect how your LittleLink fork is set up -->
      <footer>
        <!--<a href="privacy.html">Privacy Policy</a> | Build your own by forking <a href="https://littlelink.io" target="_blank" rel="noopener">LittleLink</a>-->
      </footer>

    </div>
  </div>

</body>

</html>
